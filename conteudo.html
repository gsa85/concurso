<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conteúdo — Estudos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
  <a class="voltar" href="index.html">← Voltar ao início</a>
  <h1 id="titulo">Carregando…</h1>
  <p id="subtitulo"></p>
</header>

<main class="container-layout">
  <!-- COLUNA DA ESQUERDA: A LISTA DE TEMAS -->
  <aside class="sidebar">
    <h3>Temas</h3>
    <ul class="lista" id="lista-topicos"></ul>
  </aside>

  <!-- COLUNA DA DIREITA: O RESUMO (IFRAME) -->
  <div class="area-resumo">
    <div id="tela-resumo">
      <div class="aviso-inicial">
        <h2>👈 Selecione um tema</h2>
        <p>Clique em um dos assuntos ao lado para ler o resumo.</p>
      </div>
      <div id="texto-resumo" style="display: none;"></div>
    </div>
  </div>
</main>

<script src="dados.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("t");
  const materia = CONTEUDOS[slug];

  if (!materia) {
    document.getElementById("titulo").textContent = "Conteúdo não encontrado";
    document.getElementById("subtitulo").textContent = "Volte ao início e escolha uma matéria.";
  } else {
    document.title = materia.titulo + " — Estudos";
    document.getElementById("titulo").textContent = materia.titulo;
    document.getElementById("subtitulo").textContent = materia.grupo + (materia.questoes ? " · " + materia.questoes + " questões" : "");

    const lista = document.getElementById("lista-topicos");

    materia.topicos.forEach(function (topico) {
      const isObj = typeof topico === "object";
      const texto = isObj ? topico.t : topico;
      
      const li = document.createElement("li");
      li.className = "item-sidebar";
      
      const span = document.createElement("span");
      span.innerHTML = texto;
      li.appendChild(span);

      if (isObj && topico.arquivo) {
        li.classList.add("clicavel");
        li.addEventListener("click", () => {
          // Remove a cor de selecionado de todos
          document.querySelectorAll('.item-sidebar').forEach(el => el.classList.remove('ativo'));
          // Adiciona a cor no que foi clicado
          li.classList.add('ativo');
          
          // 🪄 MÁGICA: Gera o link do HTML automaticamente baseado no nome do TXT
          const nomeBase = topico.arquivo.replace('resumos/', '').replace('.txt', '');
          const linkPagina = `paginas/${nomeBase}.html`;
          
          abrirResumo(texto, topico.arquivo, linkPagina);
        });
      } else {
        li.classList.add("sem-resumo");
      }

      lista.appendChild(li);
    });
  }

  // Função que abre o TXT e adiciona o botão do HTML
  function abrirResumo(titulo, caminhoArquivo, linkPagina) {
    const containerResumo = document.getElementById("texto-resumo");
    const avisoInicial = document.querySelector(".aviso-inicial");
    
    avisoInicial.style.display = "none";
    containerResumo.style.display = "block";
    window.scrollTo(0,0);

    // Monta o título com o botão verde do lado direito
    let htmlTitulo = `<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">`;
    htmlTitulo += `<h2 style="color: var(--primaria-esc); margin: 0; flex: 1;">${titulo}</h2>`;
    
    if (linkPagina) {
      htmlTitulo += `
        <a href="${linkPagina}" target="_blank" 
           style="font-size: 0.85rem; background: #10b981; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; white-space: nowrap; box-shadow: 0 2px 4px rgba(16,185,129,0.3); transition: 0.2s;">
           🔗 Página de Estudo
        </a>`;
    }
    htmlTitulo += `</div>`;

    // Coloca o título e o iframe na tela
    containerResumo.innerHTML = `
      ${htmlTitulo}
      <iframe src="${caminhoArquivo}" 
              style="width: 100%; height: 70vh; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
      </iframe>
    `;
  }
</script>
</body>
</html>
