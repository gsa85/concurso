<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conteúdo — Estudos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
  <a class="voltar" href="index.html">← Voltar ao início</a>
  <h1 id="titulo">Carregando…</h1>
  <p id="subtitulo"></p>
</header>

<main class="container">
  <p class="progresso" id="progresso"></p>
  <ul class="lista" id="lista"></ul>
</main>

<script src="dados.js"></script>
<script>
(function () {
  const slug = new URLSearchParams(location.search).get("t");
  const materia = CONTEUDOS[slug];

  if (!materia) {
    document.getElementById("titulo").textContent = "Conteúdo não encontrado";
    document.getElementById("subtitulo").textContent =
      "Volte ao início e escolha uma matéria.";
    return;
  }

  document.title = materia.titulo + " — Estudos";
  document.getElementById("titulo").textContent = materia.titulo;
  document.getElementById("subtitulo").textContent =
    materia.grupo + (materia.questoes ? " · " + materia.questoes + " questões" : "");

  const chaveCheck = "estudo:" + slug;
  let marcados = {};
  try { marcados = JSON.parse(localStorage.getItem(chaveCheck) || "{}"); } catch (e) {}

  const lista = document.getElementById("lista");

  function atualizarProgresso() {
    const total = materia.topicos.length;
    const feitos = Object.values(marcados).filter(Boolean).length;
    document.getElementById("progresso").textContent =
      "✅ " + feitos + " de " + total + " tópicos concluídos";
  }

  function chaveResumo(i) { return "resumo:" + slug + ":" + i; }

  function temResumoSalvo(i) {
    const v = localStorage.getItem(chaveResumo(i));
    return v !== null && v.trim() !== "";
  }

  materia.topicos.forEach(function (topico, i) {
    const isObj = typeof topico === "object" && topico !== null;
    const textoTopico = isObj ? topico.t : topico;
    const resumoInicial = isObj && topico.resumo ? topico.resumo : "";

    const li = document.createElement("li");
    li.className = "item";

    // --- Cabeçalho: checkbox + texto + botão 📝 ---
    const header = document.createElement("div");
    header.className = "item-header";

    const label = document.createElement("label");
    const caixa = document.createElement("input");
    caixa.type = "checkbox";
    caixa.checked = !!marcados[i];
    const span = document.createElement("span");
    span.innerHTML = textoTopico;
    label.appendChild(caixa);
    label.appendChild(span);

    const btnResumo = document.createElement("button");
    btnResumo.type = "button";
    btnResumo.className = "btn-resumo";
    btnResumo.title = "Adicionar / editar resumo";
    btnResumo.textContent = "📝";
    if (temResumoSalvo(i)) btnResumo.classList.add("tem-resumo");

    header.appendChild(label);
    header.appendChild(btnResumo);
    li.appendChild(header);

    // --- Subtópicos (ex.: CF/88) ---
    if (isObj && topico.sub) {
      const sub = document.createElement("ul");
      sub.className = "sub";
      topico.sub.forEach(function (s) {
        const sli = document.createElement("li");
        sli.textContent = s;
        sub.appendChild(sli);
      });
      li.appendChild(sub);
    }

    // --- Área de resumo (colapsada) ---
    const area = document.createElement("div");
    area.className = "resumo-area";
    area.hidden = true;

    const textarea = document.createElement("textarea");
    textarea.placeholder = "Escreva aqui um resumo rápido sobre este tópico...";
    const salvo = localStorage.getItem(chaveResumo(i));
    textarea.value = salvo !== null ? salvo : resumoInicial;

    const acoes = document.createElement("div");
    acoes.className = "resumo-acoes";

    const status = document.createElement("span");
    status.className = "resumo-status";

    const btnLimpar = document.createElement("button");
    btnLimpar.type = "button";
    btnLimpar.className = "btn-limpar";
    btnLimpar.textContent = "🗑️ Limpar";

    acoes.appendChild(status);
    acoes.appendChild(btnLimpar);
    area.appendChild(textarea);
    area.appendChild(acoes);
    li.appendChild(area);

    // --- Auto-save com debounce ---
    let timer;
    textarea.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        const v = textarea.value;
        if (v.trim() === "") {
          localStorage.removeItem(chaveResumo(i));
          btnResumo.classList.remove("tem-resumo");
        } else {
          localStorage.setItem(chaveResumo(i), v);
          btnResumo.classList.add("tem-resumo");
        }
        status.textContent = "Salvo ✓";
        setTimeout(function () { status.textContent = ""; }, 1500);
      }, 400);
    });

    btnLimpar.addEventListener("click", function () {
      if (!confirm("Apagar este resumo?")) return;
      textarea.value = "";
      localStorage.removeItem(chaveResumo(i));
      btnResumo.classList.remove("tem-resumo");
      status.textContent = "Resumo apagado";
      setTimeout(function () { status.textContent = ""; }, 1500);
      textarea.focus();
    });

    btnResumo.addEventListener("click", function () {
      area.hidden = !area.hidden;
      if (!area.hidden) {
        textarea.focus();
        textarea.setSelectionRange(textarea.value.length, textarea.value.length);
      }
    });

    caixa.addEventListener("change", function () {
      marcados[i] = caixa.checked;
      try { localStorage.setItem(chaveCheck, JSON.stringify(marcados)); } catch (e) {}
      atualizarProgresso();
    });

    lista.appendChild(li);
  });

  atualizarProgresso();
})();
</script>

</body>
</html>
