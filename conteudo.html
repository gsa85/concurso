<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conteúdo — Estudos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="topo">
  <a class="voltar" href="index.html">← Voltar ao início</a>
  <h1 id="titulo">Carregando…</h1>
  <p id="subtitulo"></p>
</header>

<main class="container">
  <!-- TELA DE LISTA (onde aparecem os temas) -->
  <div id="tela-lista">
    <ul class="lista" id="lista-topicos"></ul>
  </div>

  <!-- TELA DE RESUMO (abre quando clica em um tema com .txt) -->
  <div id="tela-resumo" style="display: none;">
    <button class="btn-voltar" onclick="voltarLista()">⬅️ Voltar para os tópicos</button>
    <div class="leitor-resumo">
      <h2 id="titulo-resumo"></h2>
      <div id="texto-resumo" class="texto-formatado">Carregando resumo...</div>
    </div>
  </div>
</main>

<!-- Carrega os dados das matérias -->
<script src="dados.js"></script>
<script>
  // 1. Pega a matéria que foi clicada lá na página inicial (ex: ?t=portugues)
  const slug = new URLSearchParams(location.search).get("t");
  const materia = CONTEUDOS[slug];

  if (!materia) {
    // Se a pessoa entrou no link errado
    document.getElementById("titulo").textContent = "Conteúdo não encontrado";
    document.getElementById("subtitulo").textContent = "Volte ao início e escolha uma matéria.";
  } else {
    // 2. Se achou a matéria, monta a tela
    document.title = materia.titulo + " — Estudos";
    document.getElementById("titulo").textContent = materia.titulo;
    document.getElementById("subtitulo").textContent = materia.grupo + (materia.questoes ? " · " + materia.questoes + " questões" : "");

    const lista = document.getElementById("lista-topicos");

    // 3. Passa por cada tópico da matéria e cria a caixinha na tela
    materia.topicos.forEach(function (topico) {
      const isObj = typeof topico === "object";
      const texto = isObj ? topico.t : topico;
      
      const li = document.createElement("li");
      li.className = "item";
      
      const span = document.createElement("span");
      span.innerHTML = texto;
      li.appendChild(span);

      // Se o tópico tiver a propriedade "arquivo", ele vira um botão de resumo
      if (isObj && topico.arquivo) {
        li.classList.add("clicavel");
        const tag = document.createElement("span");
        tag.className = "tag-resumo";
        tag.textContent = "📝 Ler Resumo";
        li.appendChild(tag);
        
        li.addEventListener("click", () => abrirResumo(texto, topico.arquivo));
      }

      lista.appendChild(li);
    });
  }

  // 4. Função que busca o arquivo .txt e mostra na tela
  function abrirResumo(titulo, caminhoArquivo) {
    document.getElementById("tela-lista").style.display = "none";
    document.getElementById("tela-resumo").style.display = "block";
    document.getElementById("titulo-resumo").textContent = titulo;
    document.getElementById("texto-resumo").textContent = "Buscando arquivo...";
    window.scrollTo(0,0);

    // O fetch é o que vai lá na pasta "resumos" e pega o seu arquivo txt
    fetch(caminhoArquivo)
      .then(response => {
        if (!response.ok) throw new Error("Arquivo não encontrado");
        return response.text();
      })
      .then(texto => {
        // Transforma as quebras de linha do bloco de notas em parágrafos bonitos
        document.getElementById("texto-resumo").innerHTML = texto.replace(/\n/g, "<br>");
      })
      .catch(erro => {
        document.getElementById("texto-resumo").innerHTML = 
          "<span style='color:#dc2626; font-weight:bold;'>⚠️ Erro: O arquivo não foi encontrado.</span><br><br>" +
          "Verifique se você criou a pasta <b>resumos</b> e o arquivo <b>" + caminhoArquivo + "</b> dentro dela.";
      });
  }

  // 5. Função para voltar da tela de resumo para a lista de tópicos
  function voltarLista() {
    document.getElementById("tela-resumo").style.display = "none";
    document.getElementById("tela-lista").style.display = "block";
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
