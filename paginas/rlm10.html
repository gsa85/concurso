<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sequência de números, figuras e letras — Estudo Extra</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    :root { --bg:#f1f5f9; --card:#ffffff; --texto:#1e293b; --suave:#64748b; --primaria:#2563eb; --borda:#e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--texto); padding: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; }
    .btn-voltar { display: inline-block; background: white; border: 1px solid var(--borda); padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--suave); margin-bottom: 20px; text-decoration: none; transition: 0.2s; }
    .btn-voltar:hover { background: var(--primaria); color: white; border-color: var(--primaria); }
    .card { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    h1 { color: var(--primaria); font-size: 1.4rem; margin-bottom: 20px; border-bottom: 2px solid var(--borda); padding-bottom: 15px; }
    .sandbox { margin-top: 20px; padding: 20px; background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 8px; text-align: center; color: var(--suave); }
  </style>
</head>
<body>
  <div class="container">
    <a href="javascript:history.back()" class="btn-voltar">⬅️ Voltar ao Resumo</a>
    <div class="card">
      <h1>Sequência de números, figuras e letras</h1>
      
      <!-- 👇 AQUI VOCÊ COLOCA SEUS FLASHCARDS, IMAGENS E QUIZES -->
      <div class="sandbox">
        <p>Página de estudo personalizada criada para <b>rlm10</b>.</p>
        <p>Abra este arquivo no VS Code e apague esta caixa para adicionar seu conteúdo!</p>
      </div>
      
    </div>
  </div>
</body>
</html>
